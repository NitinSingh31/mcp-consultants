<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a2f" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#c49a45" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="url(#mcpGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />
  
  <!-- MCP Stylized Text Monogram -->
  <text x="32" y="39" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Inter', -apple-system, sans-serif" 
        font-size="20" 
        font-weight="900" 
        fill="#ffffff" 
        letter-spacing="1">
    MCP
  </text>
  <circle cx="32" cy="48" r="2.5" fill="#c49a45" />
</svg>
